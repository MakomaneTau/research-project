[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidc-experiment"
version = "0.1.0"
description = "Reproducible, patient-grouped LIDC-IDRI suspicion classification experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.13,<1.14", "pandas>=2.2,<2.3",
  "scikit-learn>=1.6,<1.7", "SimpleITK>=2.5,<2.6", "pydicom>=3,<4",
  "pylidc==0.2.3", "SQLAlchemy>=1.4,<2", "setuptools<81",
  "PyYAML>=6,<7", "psutil>=6", "matplotlib>=3.9", "torch==2.11.0",
  "nbformat>=5", "ipykernel>=6", "nbclient>=0.10"
]

[project.scripts]
lidc-experiment = "lidc_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
